[package]
name = "gnomecuts"
version = "0.3.0"
edition = "2021"
description = "GNOME-style workspace shortcuts for Windows 11"
license = "MIT"
repository = "https://github.com/IanHead/GnomeCuts"

[dependencies]
# winvd wraps the undocumented virtual desktop COM API; keep `windows` on the
# same version so HWND and friends are the same types.
winvd = "0.0.49"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3.0.12"
